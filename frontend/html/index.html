<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Cadastro de Clientes</title>

    <link
        rel="stylesheet"
        href="/frontend/css/login.css"
    >

</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <div class="login-cabecalho">

                <h1>
                    Login
                </h1>

                <p>
                    Entre para acessar o sistema
                </p>

            </div>

            <form
                method="post"
                action="/login"
                id="loginForm"
            >

                <!-- E-mail -->

                <div class="campo-login">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemplo@gmail.com"
                        pattern="^[^@\s]+@[^@\s]+\.com$"
                        required
                    >

                    <small
                        id="erroEmail"
                        class="mensagem-login"
                    ></small>

                </div>


                <!-- Senha -->

                <div class="campo-login">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="campo-senha">

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            minlength="6"
                            pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z\d]).{6,}$"
                            required
                        >

                        <button
                            type="button"
                            id="mostrarSenha"
                            class="botao-olho"
                            aria-label="Mostrar senha"
                        >
                            👁
                        </button>

                    </div>

                    <small
                        id="erroSenha"
                        class="mensagem-login"
                    ></small>

                </div>


                <!-- Mensagem de credenciais -->

               <div
                id="erroCredenciais"
                class="erro-credenciais"
                ></div>


                <!-- Botão -->

                <button
                    type="submit"
                    class="botao-login"
                >
                    Entrar
                </button>

            </form>

        </div>

    </main>

    <script src="/frontend/js/login.js"></script>

</body>

</html>
