<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro de Clientes</title>

    <link
        rel="stylesheet"
        href="/frontend/css/style.css"
    >

</head>

<body>

    <main class="janela">

        <!-- Barra superior -->

        <div class="barra-superior">

            <div class="circulos">

                <span class="circulo vermelho"></span>

                <span class="circulo amarelo"></span>

                <span class="circulo verde"></span>

            </div>

        </div>

        <!-- Conteúdo -->

        <div class="conteudo">

            <h1>
                Cadastro de Clientes
            </h1>

            <!-- Formulário -->

            <form
    method="post"
    action="/clientes"
            >

                <div class="formulario">

                    <!-- Nome -->

                    <div class="campo">

                        <label for="nome">
                            Nome
                        </label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            maxlength="100"
                            required
                        >

                        <small
                            id="erroNome"
                            class="mensagem-erro"
                        ></small>

                    </div>

                    <!-- E-mail -->

                    <div class="campo">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            maxlength="100"
                            pattern="^[^@\s]+@[^@\s]+\.com(\.br)?$"
                            required
                            disabled
                        >

                        <small
                            id="erroEmail"
                            class="mensagem-erro"
                        ></small>

                    </div>

                    <!-- Telefone -->

                    <div class="campo">

                        <label for="telefone">
                            Telefone
                        </label>

                        <input
                            type="text"
                            id="telefone"
                            name="telefone"
                            maxlength="15"
                            placeholder="(49) 99999-0000"
                            required
                            disabled
                        >

                        <small
                            id="erroTelefone"
                            class="mensagem-erro"
                        ></small>

                    </div>

                    <!-- Cidade -->

                    <div class="campo">

                        <label for="cidade">
                            Cidade
                        </label>

                        <input
                            type="text"
                            id="cidade"
                            name="cidade"
                            maxlength="100"
                            required
                            disabled
                        >

                        <small
                            id="erroCidade"
                            class="mensagem-erro"
                        ></small>

                    </div>

                </div>

                <!-- Botão -->

                <div class="area-botao">

                    <button
                        type="submit"
                        id="botaoCadastrar"
                        disabled
                    >
                        Cadastrar
                    </button>

                </div>

            </form>

            <!-- Tabela -->

            <div class="tabela-container">

                <table>

                    <thead>

                        <tr>

                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Telefone</th>
                            <th>Cidade</th>

                        </tr>

                    </thead>

                    <tbody>

                        {% if clientes %}

                            {% for cliente in clientes %}

                                <tr>

                                    <td>
                                        {{ cliente.nome }}
                                    </td>

                                    <td>
                                        {{ cliente.email }}
                                    </td>

                                    <td>
                                        {{ cliente.telefone or "-" }}
                                    </td>

                                    <td>
                                        {{ cliente.cidade or "-" }}
                                    </td>

                                </tr>

                            {% endfor %}

                        {% else %}

                            <tr>

                                <td
                                    colspan="4"
                                    class="sem-clientes"
                                >
                                    Nenhum cliente cadastrado.
                                </td>

                            </tr>

                        {% endif %}

                    </tbody>

                </table>

            </div>

        </div>

    </main>

    <script src="/frontend/js/app.js"></script>

</body>

</html>
